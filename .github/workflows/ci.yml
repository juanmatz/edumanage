name: EduManage CI

# Controla cuándo se ejecuta la automatización
on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      # Paso 1: descarga el código del repositorio
      - name: Clonar el repositorio
        uses: actions/checkout@v4

      # Paso 2: configura el JDK 21 (coincide con el toolchain del proyecto)
      - name: Configurar JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: gradle

      # Paso 3: el wrapper necesita permiso de ejecución en Linux
      - name: Dar permisos de ejecución al Gradle Wrapper
        run: chmod +x gradlew

      # Paso 4: compila y ejecuta las pruebas (JUnit 5 + Mockito)
      - name: Compilar y ejecutar las pruebas
        run: ./gradlew clean test --no-daemon